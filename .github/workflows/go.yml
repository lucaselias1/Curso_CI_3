name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest # Simplificado para evitar imagens obsoletas
    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.19'] # Versões estáveis

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build and Start DB
      # Usar -d garante que o banco fique rodando em background
      run: docker compose up -d

    - name: Wait for DB to be ready
      # Pequeno delay para garantir que o Postgres terminou de iniciar
      run: sleep 10

    - name: Test
      run: go test -v main_test.go 
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.18'

    - name: Build
      # Garante que o binário gerado tenha o nome 'main' para o artefato
      run: go build -v -o main main.go
      
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: programa
        path: main

  # Job para gerar a imagem Docker
  docker_build:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

  # Job de Deploy (Agora depende do sucesso do Docker)
  deploy_ec2:
    needs: docker_build
    uses: ./.github/workflows/EC2.yml # Supondo que você tenha um para EC2
    secrets: inherit
